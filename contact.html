<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Fiesta Mágica - Contacto</title></head>
<body style="margin:0;font-family:Arial,sans-serif;background:#fff8fb;color:#443344;">
<header style="background:linear-gradient(135deg,#b8e8ff,#d9c5ff,#ffb6d5);padding:40px 20px;text-align:center;">
<h1 style="font-size:42px;">💌 Contáctanos</h1><p>Cuéntanos cómo imaginas tu fiesta ideal.</p>
</header><nav style="background:#ff6fae;padding:16px;text-align:center;">
<a href="index.html" style="color:white;text-decoration:none;margin:0 18px;font-weight:bold;">Inicio</a>
<a href="about.html" style="color:white;text-decoration:none;margin:0 18px;font-weight:bold;">Sobre nosotros</a>
<a href="contact.html" style="color:white;text-decoration:none;margin:0 18px;font-weight:bold;">Contacto</a>
</nav>
<main style="max-width:900px;margin:auto;padding:35px 20px;">
<section style="display:flex;gap:30px;flex-wrap:wrap;">
<div style="flex:1;min-width:260px;background:#ffe5f0;padding:30px;border-radius:20px;">
<h2>🎈 Estamos para ayudarte</h2><p style="line-height:1.7;">¿Buscas una decoración específica? ¿Tienes un tema en mente? Escríbenos y cuéntanos qué necesitas.</p>
<p>📧 contacto@fiestamagica.example</p><p>📱 +51 900 000 000</p><p>📍 Lima, Perú</p>
</div>
<form style="flex:1;min-width:260px;background:white;padding:30px;border-radius:20px;box-shadow:0 4px 15px #e8cddd;">
<h2 style="color:#e84f91;">Cuéntanos tu idea ✨</h2>
<label>Nombre:</label><br><input type="text" placeholder="Tu nombre" style="width:94%;padding:11px;margin:7px 0 15px;border:2px solid #ffc2da;border-radius:8px;"><br>
<label>Correo:</label><br><input type="email" placeholder="tu@email.com" style="width:94%;padding:11px;margin:7px 0 15px;border:2px solid #bdeaff;border-radius:8px;"><br>
<label>Tema de la fiesta:</label><br><select style="width:98%;padding:11px;margin:7px 0 15px;border:2px solid #ffe28a;border-radius:8px;"><option>Unicornio</option><option>Dinosaurios</option><option>Espacio</option><option>Princesas</option><option>Superhéroes</option><option>Otro</option></select><br>
<label>Mensaje:</label><br><textarea rows="5" placeholder="Cuéntanos qué necesitas..." style="width:94%;padding:11px;margin:7px 0 18px;border:2px solid #d9c5ff;border-radius:8px;"></textarea><br>
<button type="submit" style="background:#ff6fae;color:white;border:0;padding:13px 25px;border-radius:9px;font-weight:bold;">Enviar mensaje 🎉</button>
</form></section></main></body></html>
